name: Bug or visual problem
description: Report something that behaves or looks wrong.
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the visible problem and expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you click or do? A screenshot or short clip can help; avoid private information.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows/Godot version or browser, and which build/commit/HTML example.
